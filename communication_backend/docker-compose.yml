services:
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  communication-api:
    build: .
    depends_on:
      - mqtt
    ports:
      - "8000:8000"
    environment:
      MQTT_ENABLED: "true"
      MQTT_HOST: mqtt
      DATABASE_PATH: /data/communication.db
      SECRET_KEY: local-development-secret
      FLIGHT_ID: demo-flight
      FLIGHT_NUMBER: DEMO001
      AIRCRAFT_IDENTIFIER: DEMO-AIRCRAFT
    volumes:
      - communication-data:/data

volumes:
  communication-data:
